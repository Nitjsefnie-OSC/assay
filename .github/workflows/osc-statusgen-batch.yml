# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - statusgen-batch
# DELIBERATELY EXCLUDED (loud):
#   - none

name: OSC batch mutant probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string
      mutants:
        description: 'JSON array of mutant refs (branches or SHAs) to probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-statusgen-batch-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
env:
  GO_VERSION: 1.27.3
jobs:
  osc_provenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
  statusgen-batch:
    name: statusgen suite + acceptance mutation spec + changelog
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - name: Checkout candidate ref
      uses: actions/checkout@v5
      with:
        ref: ${{ matrix.mutant }}
        fetch-depth: 0
        persist-credentials: false
    - name: Mutant artifact id
      shell: bash
      run: |
        printf 'OSC_MUTANT_ID=%s\n' "$(printf '%s' "${{ matrix.mutant }}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"
    - name: Set up Go
      if: ${{ !cancelled() }}
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.3
    - name: Fetch the statusgen skew baseline (checksum-verified)
      if: ${{ !cancelled() }}
      run: bash statusgen/fetch-baseline.sh statusgen-linux-amd64 "${RUNNER_TEMP}/sg-baseline"
    - name: Test and vet statusgen
      if: ${{ !cancelled() }}
      run: |
        set -euo pipefail
        go version
        bash statusgen/prepare-test-deps.test.sh
        cd statusgen && go test ./... && go vet ./...
    - name: Warm standalone statusgen test dependencies
      if: ${{ !cancelled() }}
      working-directory: statusgen
      run: GOWORK=off go test -c -o /dev/null .
    - name: Role-bound claim transport regressions
      if: ${{ !cancelled() }}
      run: bash statusgen/test-role-claims.sh
    - name: Run the statusgen acceptance mutation spec
      if: ${{ !cancelled() }}
      working-directory: statusgen
      run: |
        set -euo pipefail
        go build -C ../tools/desk -o "$RUNNER_TEMP/muhar" ./cmd/muhar
        report="$("$RUNNER_TEMP/muhar" -j 0 -spec acceptance-mutations.json)"
        echo "$report"
        grep -qE 'Totals: [0-9]+ caught, 0 NOT CAUGHT, 0 could-not-mutate' <<<"$report"
    - name: A fragment must be added and carry a bullet
      run: |
        set -euo pipefail
        BASE=""
        if [ -z "$BASE" ]; then
          BASE="$(git ls-remote https://github.com/medici-finance/assay.git refs/heads/main | cut -f1)"
        fi
        git fetch --quiet https://github.com/medici-finance/assay.git "$BASE"
        added="$(git diff --name-only --diff-filter=A "$BASE"..HEAD -- changelog/)"
        echo "added fragments: $added"
        if [ -z "$added" ] && ! git diff --name-only "$BASE"..HEAD -- CHANGELOG.md | grep -q .; then
          echo "no changelog fragment added and CHANGELOG.md untouched - changelog-check would refuse"
          exit 1
        fi
        for f in $added; do
          if ! grep -q '^-' "$f"; then
            echo "$f carries no bullet line - changelog-check would refuse"
            exit 1
          fi
        done
      if: ${{ !cancelled() }}
    - name: Mutant verdict (killed)
      if: failure()
      shell: bash
      run: |
        printf 'MUTANT %s: killed\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Mutant verdict (survived)
      if: success()
      shell: bash
      run: |
        printf 'MUTANT %s: survived\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Upload mutant results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutant-results-${{ strategy.job-index }}-${{ env.OSC_MUTANT_ID }}
        path: ${{ github.workspace }}/osc-mutant-results.txt
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
    continue-on-error: true
