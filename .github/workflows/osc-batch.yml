name: OSC batch mutant probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string
      mutants:
        description: 'JSON array of mutant refs (branches or SHAs) to probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-batch-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
env:
  GO_VERSION: 1.27.3
jobs:
  osc_provenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
  desktoken-batch:
    name: desktoken ${{ matrix.mutant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout mutant ref
      uses: actions/checkout@v5
      with:
        ref: ${{ matrix.mutant }}
        fetch-depth: 0
        persist-credentials: false
    - name: Mutant artifact id
      shell: bash
      run: |
        printf 'mutant-ref=%s\n' "$MUTANT_REF"
        printf 'mutant-checked-out-sha=%s\n' "$(git rev-parse HEAD)"
        printf 'OSC_MUTANT_ID=%s\n' "$(printf '%s' "$MUTANT_REF" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"
      env:
        MUTANT_REF: ${{ matrix.mutant }}
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.3
    - name: Build the desk module
      working-directory: tools/desk
      run: go build ./...
    - name: desktoken suite (the spec's own test command)
      if: ${{ !cancelled() }}
      working-directory: tools/desk
      timeout-minutes: 12
      run: |
        set -euo pipefail
        go test ./cmd/desktoken/... ./internal/credential/... -count=1 -timeout 600s
    - name: Run the full desktoken mutation spec
      if: ${{ !cancelled() }}
      working-directory: tools/desk
      run: |
        set -euo pipefail
        report_status=0
        report="$(go run ./cmd/muhar -j 0 -spec cmd/desktoken/mutations.json)" || report_status=$?
        printf '%s\n' "$report"
        test "$report_status" -eq 0
        grep -qE '^Totals: [0-9]+ caught, 0 NOT CAUGHT, 0 could-not-mutate\.$' <<<"$report"
    - name: A fragment must be added and carry a bullet
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        set -euo pipefail
        BASE="$(git ls-remote https://github.com/medici-finance/assay.git refs/heads/main | cut -f1)"
        git fetch --quiet https://github.com/medici-finance/assay.git "$BASE"
        added="$(git diff --name-only --diff-filter=A "$BASE"..HEAD -- changelog/)"
        echo "added fragments: $added"
        if [ -z "$added" ] && ! git diff --name-only "$BASE"..HEAD -- CHANGELOG.md | grep -q .; then
          echo "no changelog fragment added and CHANGELOG.md untouched - changelog-check would refuse"
          exit 1
        fi
        for f in $added; do
          if ! grep -q '^-' "$f"; then
            echo "$f carries no bullet line - changelog-check would refuse"
            exit 1
          fi
        done
    - name: Mutant verdict (killed)
      if: failure()
      shell: bash
      run: |
        printf 'MUTANT %s: killed\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Mutant verdict (survived)
      if: success()
      shell: bash
      run: |
        printf 'MUTANT %s: survived\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Upload mutant results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutant-results-${{ strategy.job-index }}-${{ env.OSC_MUTANT_ID }}
        path: ${{ github.workspace }}/osc-mutant-results.txt
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
    continue-on-error: true
